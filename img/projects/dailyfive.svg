<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#182240"/>
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="dfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#dfBg)"/>
  <!-- Morning sunrise glow -->
  <circle cx="320" cy="180" r="160" fill="#38bdf8" opacity="0.08" filter="url(#dfGlow)"/>
  <!-- Mobile Smartphone Mockup Frame -->
  <g transform="translate(235, 30)" filter="url(#dfGlow)">
    <rect x="0" y="0" width="170" height="260" rx="24" fill="#0c1427" stroke="url(#phoneGlow)" stroke-width="2.5"/>
    <!-- Speaker & Camera notch -->
    <rect x="55" y="10" width="60" height="6" rx="3" fill="#1e293b"/>
    <!-- App Content Cards -->
    <!-- Card 1: Mail summary -->
    <rect x="15" y="32" width="140" height="42" rx="8" fill="#1e293b" opacity="0.8"/>
    <circle cx="30" cy="53" r="8" fill="#38bdf8"/>
    <rect x="46" y="46" width="70" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="46" y="56" width="95" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    <!-- Card 2: Tech Watch / Articles -->
    <rect x="15" y="82" width="140" height="42" rx="8" fill="#1e293b" opacity="0.8"/>
    <circle cx="30" cy="103" r="8" fill="#818cf8"/>
    <rect x="46" y="96" width="80" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="46" y="106" width="90" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    <!-- Card 3: Traffic & Weather -->
    <rect x="15" y="132" width="140" height="42" rx="8" fill="#1e293b" opacity="0.8"/>
    <circle cx="30" cy="153" r="8" fill="#34d399"/>
    <rect x="46" y="146" width="60" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="46" y="156" width="85" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    <!-- Card 4: Schedule -->
    <rect x="15" y="182" width="140" height="42" rx="8" fill="#1e293b" opacity="0.8"/>
    <circle cx="30" cy="203" r="8" fill="#f472b6"/>
    <rect x="46" y="196" width="75" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="46" y="206" width="80" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
  </g>
  <text x="320" y="325" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#818cf8" text-anchor="middle">
    DAILY FIVE · REACT NATIVE &amp; APIS REST · HUB MATINAL
  </text>
</svg>

