<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="volleyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e"/>
      <stop offset="50%" stop-color="#0c253d"/>
      <stop offset="100%" stop-color="#143b5c"/>
    </linearGradient>
    <linearGradient id="ballYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ballBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="motionFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="volleyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#volleyBg)"/>

  <!-- Perspective Court Lines -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="2">
    <!-- Baseline & Sidelines in isometric perspective -->
    <polygon points="120,320 520,320 440,210 200,210" fill="none"/>
    <!-- Attack line 3m -->
    <line x1="160" y1="265" x2="480" y2="265" stroke-dasharray="8,6"/>
    <!-- Center Line & Net base -->
    <line x1="200" y1="210" x2="440" y2="210" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Net Mesh -->
  <g opacity="0.45">
    <!-- Net posts -->
    <line x1="180" y1="210" x2="180" y2="120" stroke="#ffffff" stroke-width="3"/>
    <line x1="460" y1="210" x2="460" y2="120" stroke="#ffffff" stroke-width="3"/>
    <!-- Top net band -->
    <line x1="180" y1="120" x2="460" y2="120" stroke="#ffffff" stroke-width="4"/>
    <!-- Bottom net band -->
    <line x1="180" y1="165" x2="460" y2="165" stroke="#ffffff" stroke-width="2"/>
    <!-- Net grid -->
    <line x1="220" y1="120" x2="220" y2="165" stroke="#ffffff" stroke-width="1"/>
    <line x1="260" y1="120" x2="260" y2="165" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="120" x2="300" y2="165" stroke="#ffffff" stroke-width="1"/>
    <line x1="340" y1="120" x2="340" y2="165" stroke="#ffffff" stroke-width="1"/>
    <line x1="380" y1="120" x2="380" y2="165" stroke="#ffffff" stroke-width="1"/>
    <line x1="420" y1="120" x2="420" y2="165" stroke="#ffffff" stroke-width="1"/>
    <line x1="180" y1="135" x2="460" y2="135" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="180" y1="150" x2="460" y2="150" stroke="#ffffff" stroke-width="0.8"/>
  </g>

  <!-- Dynamic Motion Arcs (Smash / Jump trajectory) -->
  <path d="M 80 260 Q 220 50 340 100" fill="none" stroke="url(#motionFade)" stroke-width="3.5" stroke-dasharray="10,6" filter="url(#volleyGlow)"/>
  <path d="M 120 280 Q 240 70 340 100" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <path d="M 340 100 Q 420 180 500 290" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>

  <!-- Energy Burst / Impact Rays around the ball -->
  <g transform="translate(340, 100)" filter="url(#volleyGlow)" opacity="0.7">
    <line x1="0" y1="0" x2="-40" y2="-30" stroke="#fbbf24" stroke-width="2"/>
    <line x1="0" y1="0" x2="30" y2="-40" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="0" x2="-50" y2="10" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="0" x2="45" y2="15" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Stylized Volleyball (Mikasa Design) -->
  <g transform="translate(340, 100)" filter="url(#volleyGlow)">
    <!-- Ball Base Circle -->
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Swirling Panels (Blue & Yellow) -->
    <!-- Panel 1 (Top Blue) -->
    <path d="M -54 0 A 54 54 0 0 1 0 -54 C -10 -20 -30 0 -54 0 Z" fill="url(#ballBlue)"/>
    <!-- Panel 2 (Top Yellow) -->
    <path d="M 0 -54 A 54 54 0 0 1 54 0 C 20 -10 0 -30 0 -54 Z" fill="url(#ballYellow)"/>
    <!-- Panel 3 (Right Blue) -->
    <path d="M 54 0 A 54 54 0 0 1 0 54 C 10 20 30 0 54 0 Z" fill="url(#ballBlue)"/>
    <!-- Panel 4 (Bottom Yellow) -->
    <path d="M 0 54 A 54 54 0 0 1 -54 0 C -20 10 0 30 0 54 Z" fill="url(#ballYellow)"/>
    <!-- Center Wave Swirls -->
    <path d="M -30 -15 C 0 -40 25 -10 30 20 C 5 40 -20 10 -30 -15 Z" fill="url(#ballBlue)" opacity="0.9"/>
    <path d="M -20 25 C -40 5 -10 -25 20 -30 C 40 -5 10 25 -20 25 Z" fill="url(#ballYellow)" opacity="0.9"/>

    <!-- Seam Outlines -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M -54 0 C -20 -10 0 -30 0 -54" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M 0 -54 C 10 -20 30 0 54 0" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M 54 0 C 20 10 0 30 0 54" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M 0 54 C -10 20 -30 0 -54 0" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  </g>

  <!-- Speed Streaks Bottom -->
  <line x1="450" y1="260" x2="520" y2="300" stroke="#fbbf24" stroke-width="3" opacity="0.7"/>
  <line x1="470" y1="240" x2="540" y2="280" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Label Bottom -->
  <g transform="translate(320, 315)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#fbbf24">
      VOLLEYBALL &amp; ESPRIT D'ÉQUIPE · COMPÉTITION &amp; COHÉSION
    </text>
  </g>
</svg>

