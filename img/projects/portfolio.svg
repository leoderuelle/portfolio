<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pXmbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="100%" stop-color="#0a3c74"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#pXmbBg)"/>
  <!-- PS3 wave ribbons -->
  <path d="M 0 200 Q 160 80 320 200 T 640 200 L 640 360 L 0 360 Z" fill="rgba(120,190,255,0.18)" stroke="rgba(190,225,255,0.6)" stroke-width="2.5"/>
  <path d="M 0 220 Q 200 320 400 210 T 640 230 L 640 360 L 0 360 Z" fill="rgba(60,140,230,0.22)" stroke="rgba(150,205,255,0.5)" stroke-width="3"/>
  <!-- Glowing XMB Cross Axis -->
  <line x1="0" y1="180" x2="640" y2="180" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="280" y1="0" x2="280" y2="360" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Centered PS3 Disc Icon -->
  <circle cx="280" cy="180" r="32" fill="#0f2b48" stroke="#70b8ff" stroke-width="3" filter="url(#pGlow)"/>
  <circle cx="280" cy="180" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Floating PlayStation Symbols -->
  <g opacity="0.75" font-family="'JetBrains Mono', monospace" font-size="22" fill="#ffffff" filter="url(#pGlow)">
    <text x="360" y="140">✕</text>
    <text x="420" y="186">○</text>
    <text x="360" y="235">△</text>
    <text x="190" y="186">□</text>
  </g>
  <text x="320" y="325" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#70b8ff" text-anchor="middle">
    PORTFOLIO CROSSMEDIABAR · VANILLA JS &amp; WEB AUDIO
  </text>
</svg>

