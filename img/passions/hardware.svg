<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041210"/>
      <stop offset="50%" stop-color="#07241e"/>
      <stop offset="100%" stop-color="#0e3a33"/>
    </linearGradient>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b382c"/>
      <stop offset="100%" stop-color="#051f18"/>
    </linearGradient>
    <linearGradient id="goldBus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dieGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52e3c2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="hwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#hwBg)"/>

  <!-- PCB Circuit Grid Traces -->
  <g stroke="#52e3c2" stroke-width="1.2" opacity="0.4" fill="none">
    <!-- Left Traces -->
    <path d="M 40 80 L 160 80 L 210 130 L 250 130"/>
    <path d="M 40 100 L 140 100 L 190 150 L 250 150"/>
    <path d="M 40 120 L 120 120 L 170 170 L 250 170"/>
    <path d="M 40 180 L 150 180 L 200 190 L 250 190"/>
    <path d="M 40 240 L 140 240 L 190 210 L 250 210"/>
    <path d="M 40 260 L 160 260 L 210 230 L 250 230"/>

    <!-- Right Traces -->
    <path d="M 600 80 L 480 80 L 430 130 L 390 130"/>
    <path d="M 600 100 L 500 100 L 450 150 L 390 150"/>
    <path d="M 600 120 L 520 120 L 470 170 L 390 170"/>
    <path d="M 600 180 L 490 180 L 440 190 L 390 190"/>
    <path d="M 600 240 L 500 240 L 450 210 L 390 210"/>
    <path d="M 600 260 L 480 260 L 430 230 L 390 230"/>

    <!-- Top & Bottom Traces -->
    <path d="M 320 20 L 320 100"/>
    <path d="M 300 20 L 300 100"/>
    <path d="M 340 20 L 340 100"/>
    <path d="M 320 340 L 320 260"/>
    <path d="M 300 340 L 300 260"/>
    <path d="M 340 340 L 340 260"/>
  </g>

  <!-- Via Holes on Traces -->
  <g fill="#07241e" stroke="#52e3c2" stroke-width="1.5">
    <circle cx="40" cy="80" r="4"/>
    <circle cx="40" cy="100" r="4"/>
    <circle cx="40" cy="120" r="4"/>
    <circle cx="40" cy="180" r="4"/>
    <circle cx="40" cy="240" r="4"/>
    <circle cx="40" cy="260" r="4"/>

    <circle cx="600" cy="80" r="4"/>
    <circle cx="600" cy="100" r="4"/>
    <circle cx="600" cy="120" r="4"/>
    <circle cx="600" cy="180" r="4"/>
    <circle cx="600" cy="240" r="4"/>
    <circle cx="600" cy="260" r="4"/>

    <circle cx="300" cy="20" r="4"/>
    <circle cx="320" cy="20" r="4"/>
    <circle cx="340" cy="20" r="4"/>
  </g>

  <!-- SMD Capacitors & Resistors flanking CPU -->
  <g fill="#1a3b34" stroke="#52e3c2" stroke-width="1">
    <!-- Left row -->
    <rect x="225" y="125" width="8" height="14" rx="2"/>
    <rect x="225" y="145" width="8" height="14" rx="2"/>
    <rect x="225" y="165" width="8" height="14" rx="2"/>
    <rect x="225" y="185" width="8" height="14" rx="2"/>
    <rect x="225" y="205" width="8" height="14" rx="2"/>
    <rect x="225" y="225" width="8" height="14" rx="2"/>

    <!-- Right row -->
    <rect x="407" y="125" width="8" height="14" rx="2"/>
    <rect x="407" y="145" width="8" height="14" rx="2"/>
    <rect x="407" y="165" width="8" height="14" rx="2"/>
    <rect x="407" y="185" width="8" height="14" rx="2"/>
    <rect x="407" y="205" width="8" height="14" rx="2"/>
    <rect x="407" y="225" width="8" height="14" rx="2"/>
  </g>

  <!-- CPU Socket Outer Substrate -->
  <g transform="translate(320, 180)" filter="url(#hwGlow)">
    <rect x="-85" y="-85" width="170" height="170" rx="14" fill="#0d2e27" stroke="#52e3c2" stroke-width="2.5"/>

    <!-- Gold Pin Contact Perimeter -->
    <rect x="-75" y="-75" width="150" height="150" rx="10" fill="none" stroke="url(#goldBus)" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Integrated Heat Spreader (IHS) Metallic Lid -->
    <rect x="-60" y="-60" width="120" height="120" rx="8" fill="#133d34" stroke="#7efbe0" stroke-width="2"/>

    <!-- Silicon Die Core Glowing Center -->
    <rect x="-35" y="-35" width="70" height="70" rx="4" fill="url(#dieGlow)" stroke="#ffffff" stroke-width="1.5" opacity="0.85"/>

    <!-- Inner Core Micro-circuits -->
    <rect x="-24" y="-24" width="20" height="20" fill="#041210" opacity="0.6"/>
    <rect x="4" y="-24" width="20" height="20" fill="#041210" opacity="0.6"/>
    <rect x="-24" y="4" width="20" height="20" fill="#041210" opacity="0.6"/>
    <rect x="4" y="4" width="20" height="20" fill="#041210" opacity="0.6"/>

    <!-- Gold Alignment Triangle (Pin 1) -->
    <polygon points="-52,-52 -44,-52 -52,-44" fill="#fbbf24"/>
  </g>

  <!-- Memory / PCIe Slots Accents -->
  <g stroke="#52e3c2" stroke-width="1.5" opacity="0.5">
    <!-- Top RAM slot edge -->
    <rect x="230" y="55" width="180" height="16" rx="2" fill="#07241e"/>
    <line x1="240" y1="63" x2="400" y2="63" stroke="#fbbf24" stroke-dasharray="3,2"/>
  </g>

  <!-- Label Bottom -->
  <g transform="translate(320, 315)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#52e3c2">
      INFORMATIQUE &amp; HARDWARE · ARCHITECTURE &amp; MONTAGE PC
    </text>
  </g>
</svg>

