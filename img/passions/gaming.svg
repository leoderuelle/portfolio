<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0f172e"/>
      <stop offset="100%" stop-color="#191336"/>
    </linearGradient>
    <linearGradient id="glowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="screenAmbient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="gameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#gameBg)"/>

  <!-- Ambient Monitor Glow -->
  <rect width="640" height="360" fill="url(#screenAmbient)"/>

  <!-- Curved Horizon & Ambient Waves -->
  <path d="M 0 160 Q 320 230 640 160" fill="none" stroke="url(#glowBar)" stroke-width="1.5" opacity="0.4"/>
  <path d="M 0 180 Q 320 270 640 180" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Modern Gaming Display Outline in Background -->
  <g opacity="0.25" stroke="#818cf8" stroke-width="1.5" fill="none">
    <rect x="120" y="30" width="400" height="150" rx="14"/>
    <line x1="280" y1="180" x2="360" y2="180"/>
    <line x1="320" y1="180" x2="320" y2="210"/>
    <line x1="270" y1="210" x2="370" y2="210"/>
  </g>

  <!-- Floating Iconic PlayStation Action Symbols -->
  <g filter="url(#gameGlow)">
    <!-- Triangle (Green / Cyan) -->
    <g transform="translate(140, 90)">
      <polygon points="20,5 5,32 35,32" fill="none" stroke="#52e3c2" stroke-width="2.5" opacity="0.8"/>
    </g>
    <!-- Square (Pink) -->
    <g transform="translate(180, 180)">
      <rect x="0" y="0" width="28" height="28" rx="4" fill="none" stroke="#ff758c" stroke-width="2.5" opacity="0.8"/>
    </g>
    <!-- Circle (Red / Coral) -->
    <g transform="translate(460, 90)">
      <circle cx="18" cy="18" r="14" fill="none" stroke="#ff5c7c" stroke-width="2.5" opacity="0.8"/>
    </g>
    <!-- Cross (Blue) -->
    <g transform="translate(430, 180)">
      <line x1="5" y1="5" x2="27" y2="27" stroke="#70b8ff" stroke-width="2.8" opacity="0.85"/>
      <line x1="27" y1="5" x2="5" y2="27" stroke="#70b8ff" stroke-width="2.8" opacity="0.85"/>
    </g>
  </g>

  <!-- Modern Ergonomic Controller (Centerpiece) -->
  <g transform="translate(180, 75)" filter="url(#gameGlow)">
    <!-- Main Shell -->
    <path d="M 50 185 C 20 185 0 150 15 100 C 25 65 60 45 100 45 L 180 45 C 220 45 255 65 265 100 C 280 150 260 185 230 185 C 200 185 185 130 170 130 L 110 130 C 95 130 80 185 50 185 Z"
          fill="#0c1224" stroke="url(#glowBar)" stroke-width="2.5"/>

    <!-- Lightbar Touchpad (DualSense / PS4-PS5 style) -->
    <rect x="95" y="48" width="90" height="42" rx="8" fill="#141c33" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <!-- LED Light Strip on Touchpad -->
    <path d="M 98 48 Q 140 54 182 48" fill="none" stroke="url(#glowBar)" stroke-width="3" filter="url(#gameGlow)"/>

    <!-- D-Pad Left -->
    <g transform="translate(48, 80)">
      <rect x="10" y="0" width="12" height="32" rx="3" fill="#202945" stroke="#38bdf8" stroke-width="1"/>
      <rect x="0" y="10" width="32" height="12" rx="3" fill="#202945" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="16" cy="16" r="3" fill="#38bdf8" opacity="0.7"/>
    </g>

    <!-- Face Buttons Right -->
    <g transform="translate(200, 75)">
      <!-- Triangle -->
      <circle cx="16" cy="6" r="8" fill="#182038" stroke="#52e3c2" stroke-width="1.2"/>
      <polygon points="16,3 13,8 19,8" fill="#52e3c2"/>
      <!-- Cross -->
      <circle cx="16" cy="38" r="8" fill="#182038" stroke="#70b8ff" stroke-width="1.2"/>
      <line x1="13" y1="35" x2="19" y2="41" stroke="#70b8ff" stroke-width="1.5"/>
      <line x1="19" y1="35" x2="13" y2="41" stroke="#70b8ff" stroke-width="1.5"/>
      <!-- Square -->
      <circle cx="0" cy="22" r="8" fill="#182038" stroke="#ff758c" stroke-width="1.2"/>
      <rect x="-3" y="19" width="6" height="6" fill="#ff758c"/>
      <!-- Circle -->
      <circle cx="32" cy="22" r="8" fill="#182038" stroke="#ff5c7c" stroke-width="1.2"/>
      <circle cx="32" cy="22" r="3" fill="none" stroke="#ff5c7c" stroke-width="1.5"/>
    </g>

    <!-- Analog Sticks with Glowing Halo -->
    <g transform="translate(85, 128)">
      <circle cx="18" cy="18" r="22" fill="#080e1c" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      <circle cx="18" cy="18" r="14" fill="#1c2540" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="8" fill="#263354"/>
    </g>
    <g transform="translate(157, 128)">
      <circle cx="18" cy="18" r="22" fill="#080e1c" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
      <circle cx="18" cy="18" r="14" fill="#1c2540" stroke="#c084fc" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="8" fill="#263354"/>
    </g>
  </g>

  <!-- Soundwave / Frequency Accents in Background -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="80" y1="280" x2="80" y2="295"/>
    <line x1="90" y1="270" x2="90" y2="305"/>
    <line x1="100" y1="260" x2="100" y2="315"/>
    <line x1="110" y1="275" x2="110" y2="300"/>
    <line x1="120" y1="285" x2="120" y2="290"/>

    <line x1="520" y1="285" x2="520" y2="290"/>
    <line x1="530" y1="275" x2="530" y2="300"/>
    <line x1="540" y1="260" x2="540" y2="315"/>
    <line x1="550" y1="270" x2="550" y2="305"/>
    <line x1="560" y1="280" x2="560" y2="295"/>
  </g>

  <!-- Label Bottom -->
  <g transform="translate(320, 318)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#818cf8">
      JEUX VIDÉO · GAMEPLAY &amp; UNIVERS INTERACTIFS
    </text>
  </g>
</svg>

