<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pacBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="100%" stop-color="#0b1029"/>
    </linearGradient>
    <filter id="pacGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#pacBg)"/>
  <!-- Maze neon blue outline walls -->
  <g stroke="#2563eb" stroke-width="3" fill="none" opacity="0.6">
    <rect x="80" y="40" width="480" height="230" rx="10"/>
    <path d="M 80 130 L 180 130 L 180 170 L 80 170"/>
    <path d="M 560 130 L 460 130 L 460 170 L 560 170"/>
    <path d="M 270 40 L 270 100 L 370 100 L 370 40"/>
    <path d="M 270 270 L 270 210 L 370 210 L 370 270"/>
    <!-- Ghost House Box -->
    <rect x="260" y="130" width="120" height="60" rx="4"/>
  </g>
  <!-- Pellets / dots -->
  <g fill="#fbbf24" opacity="0.75">
    <circle cx="130" cy="85" r="4"/>
    <circle cx="170" cy="85" r="4"/>
    <circle cx="210" cy="85" r="4"/>
    <circle cx="210" cy="125" r="4"/>
    <circle cx="210" cy="165" r="4"/>
    <!-- Energizer pill -->
    <circle cx="130" cy="225" r="8" fill="#fbbf24" filter="url(#pacGlow)"/>
    <circle cx="170" cy="225" r="4"/>
    <circle cx="210" cy="225" r="4"/>
    <circle cx="250" cy="225" r="4"/>
  </g>
  <!-- Pacman Entity -->
  <g transform="translate(190, 150)" filter="url(#pacGlow)">
    <path d="M 0 0 L 28 -18 A 32 32 0 1 0 28 18 Z" fill="#fbbf24"/>
  </g>
  <!-- Ghosts: Blinky (Red), Pinky (Pink), Inky (Cyan) -->
  <!-- Blinky (Red) -->
  <g transform="translate(340, 145)" filter="url(#pacGlow)">
    <path d="M 0 0 C 0 -16, 26 -16, 26 0 L 26 22 L 20 18 L 13 22 L 7 18 L 0 22 Z" fill="#ef4444"/>
    <circle cx="7" cy="2" r="4" fill="#ffffff"/>
    <circle cx="5" cy="2" r="2" fill="#000000"/>
    <circle cx="19" cy="2" r="4" fill="#ffffff"/>
    <circle cx="17" cy="2" r="2" fill="#000000"/>
  </g>
  <!-- Pinky (Pink) -->
  <g transform="translate(390, 145)" filter="url(#pacGlow)">
    <path d="M 0 0 C 0 -16, 26 -16, 26 0 L 26 22 L 20 18 L 13 22 L 7 18 L 0 22 Z" fill="#ec4899"/>
    <circle cx="7" cy="2" r="4" fill="#ffffff"/>
    <circle cx="5" cy="2" r="2" fill="#000000"/>
    <circle cx="19" cy="2" r="4" fill="#ffffff"/>
    <circle cx="17" cy="2" r="2" fill="#000000"/>
  </g>
  <!-- Inky (Cyan) -->
  <g transform="translate(440, 145)" filter="url(#pacGlow)">
    <path d="M 0 0 C 0 -16, 26 -16, 26 0 L 26 22 L 20 18 L 13 22 L 7 18 L 0 22 Z" fill="#06b6d4"/>
    <circle cx="7" cy="2" r="4" fill="#ffffff"/>
    <circle cx="5" cy="2" r="2" fill="#000000"/>
    <circle cx="19" cy="2" r="4" fill="#ffffff"/>
    <circle cx="17" cy="2" r="2" fill="#000000"/>
  </g>
  <text x="320" y="325" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#fbbf24" text-anchor="middle">
    PACMAN JAVAFX · JEU VIDÉO D'ARCADE · GAME LOOP &amp; IA FANTÔMES
  </text>
</svg>

