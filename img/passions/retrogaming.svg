<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="retroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070717"/>
      <stop offset="50%" stop-color="#120d2a"/>
      <stop offset="100%" stop-color="#1f0f35"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3388"/>
      <stop offset="100%" stop-color="#ff77bb"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#70f3ff"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3388" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff3388" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="retroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#retroBg)"/>

  <!-- Synthwave Grid Horizon -->
  <g opacity="0.5">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="210" x2="640" y2="210" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="0" y1="225" x2="640" y2="225" stroke="url(#gridFade)" stroke-width="1.2"/>
    <line x1="0" y1="245" x2="640" y2="245" stroke="url(#gridFade)" stroke-width="1.4"/>
    <line x1="0" y1="272" x2="640" y2="272" stroke="url(#gridFade)" stroke-width="1.8"/>
    <line x1="0" y1="310" x2="640" y2="310" stroke="url(#gridFade)" stroke-width="2.2"/>
    <line x1="0" y1="358" x2="640" y2="358" stroke="url(#gridFade)" stroke-width="2.6"/>

    <!-- Converging Perspective Lines -->
    <line x1="320" y1="200" x2="-80" y2="360" stroke="#ff3388" stroke-width="1.2" opacity="0.4"/>
    <line x1="320" y1="200" x2="60" y2="360" stroke="#ff3388" stroke-width="1.2" opacity="0.5"/>
    <line x1="320" y1="200" x2="180" y2="360" stroke="#00f0ff" stroke-width="1.4" opacity="0.6"/>
    <line x1="320" y1="200" x2="270" y2="360" stroke="#00f0ff" stroke-width="1.6" opacity="0.7"/>
    <line x1="320" y1="200" x2="320" y2="360" stroke="#00f0ff" stroke-width="1.8" opacity="0.8"/>
    <line x1="320" y1="200" x2="370" y2="360" stroke="#00f0ff" stroke-width="1.6" opacity="0.7"/>
    <line x1="320" y1="200" x2="460" y2="360" stroke="#00f0ff" stroke-width="1.4" opacity="0.6"/>
    <line x1="320" y1="200" x2="580" y2="360" stroke="#ff3388" stroke-width="1.2" opacity="0.5"/>
    <line x1="320" y1="200" x2="720" y2="360" stroke="#ff3388" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- Glowing Sun / Horizon Glow -->
  <circle cx="320" cy="185" r="70" fill="none" stroke="#ff3388" stroke-width="2" opacity="0.4" filter="url(#retroGlow)"/>
  <circle cx="320" cy="185" r="45" fill="#ff2277" opacity="0.15" filter="url(#retroGlow)"/>

  <!-- Stylized Retro Gamepad Body -->
  <g transform="translate(180, 75)" filter="url(#retroGlow)">
    <!-- Controller Frame -->
    <rect x="0" y="20" width="280" height="150" rx="35" fill="#131428" stroke="#00f0ff" stroke-width="2.5" opacity="0.95"/>
    <!-- Grips Accent -->
    <path d="M 20 120 C 10 160, 45 180, 80 155" fill="none" stroke="#ff3388" stroke-width="3" opacity="0.8"/>
    <path d="M 260 120 C 270 160, 235 180, 200 155" fill="none" stroke="#ff3388" stroke-width="3" opacity="0.8"/>

    <!-- Screen / Center Logo Area -->
    <rect x="95" y="45" width="90" height="50" rx="8" fill="#080a18" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <!-- Pixel Heart in Screen -->
    <g transform="translate(130, 60) scale(1.6)">
      <rect x="0" y="2" width="4" height="4" fill="#ff3388"/>
      <rect x="4" y="0" width="4" height="4" fill="#ff3388"/>
      <rect x="8" y="0" width="4" height="4" fill="#ff3388"/>
      <rect x="12" y="2" width="4" height="4" fill="#ff3388"/>
      <rect x="0" y="6" width="16" height="4" fill="#ff3388"/>
      <rect x="2" y="10" width="12" height="4" fill="#ff3388"/>
      <rect x="4" y="14" width="8" height="4" fill="#ff3388"/>
      <rect x="6" y="18" width="4" height="4" fill="#ff3388"/>
    </g>

    <!-- D-Pad Left -->
    <g transform="translate(42, 70)">
      <rect x="12" y="0" width="12" height="36" rx="2" fill="#252945" stroke="#00f0ff" stroke-width="1.5"/>
      <rect x="0" y="12" width="36" height="12" rx="2" fill="#252945" stroke="#00f0ff" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="3" fill="#00f0ff"/>
    </g>

    <!-- PlayStation Action Buttons Right -->
    <g transform="translate(202, 62)">
      <!-- Triangle (Top) -->
      <circle cx="20" cy="8" r="9" fill="#1b203a" stroke="#00f0ff" stroke-width="1.5"/>
      <polygon points="20,4 16,11 24,11" fill="none" stroke="#52e3c2" stroke-width="1.5"/>

      <!-- Cross (Bottom) -->
      <circle cx="20" cy="44" r="9" fill="#1b203a" stroke="#00f0ff" stroke-width="1.5"/>
      <line x1="16" y1="40" x2="24" y2="48" stroke="#70b8ff" stroke-width="1.5"/>
      <line x1="24" y1="40" x2="16" y2="48" stroke="#70b8ff" stroke-width="1.5"/>

      <!-- Square (Left) -->
      <circle cx="2" cy="26" r="9" fill="#1b203a" stroke="#00f0ff" stroke-width="1.5"/>
      <rect x="-2" y="22" width="8" height="8" fill="none" stroke="#ff758c" stroke-width="1.5"/>

      <!-- Circle (Right) -->
      <circle cx="38" cy="26" r="9" fill="#1b203a" stroke="#00f0ff" stroke-width="1.5"/>
      <circle cx="38" cy="26" r="4.5" fill="none" stroke="#ff3388" stroke-width="1.5"/>
    </g>

    <!-- Thumbsticks / Centers -->
    <circle cx="110" cy="120" r="16" fill="#181c33" stroke="#4a5585" stroke-width="2"/>
    <circle cx="110" cy="120" r="10" fill="#232845"/>
    <circle cx="170" cy="120" r="16" fill="#181c33" stroke="#4a5585" stroke-width="2"/>
    <circle cx="170" cy="120" r="10" fill="#232845"/>
  </g>

  <!-- Floating Pixel Elements -->
  <rect x="80" y="80" width="8" height="8" fill="#00f0ff" opacity="0.6"/>
  <rect x="100" y="110" width="6" height="6" fill="#ff3388" opacity="0.7"/>
  <rect x="520" y="90" width="10" height="10" fill="#ff3388" opacity="0.6"/>
  <rect x="545" y="125" width="6" height="6" fill="#00f0ff" opacity="0.7"/>
  <rect x="500" y="160" width="8" height="8" fill="#52e3c2" opacity="0.5"/>

  <!-- Badge Text -->
  <g transform="translate(320, 315)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#00f0ff">
      RÉTROGAMING &amp; ÉMULATION · C++ / SDL2
    </text>
  </g>

  <!-- CRT Scanlines Overlay -->
  <rect width="640" height="360" fill="url(#scanlines)" pointer-events="none"/>
</svg>

