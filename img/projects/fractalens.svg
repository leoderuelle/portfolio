<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="frBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0314"/>
      <stop offset="50%" stop-color="#18072b"/>
      <stop offset="100%" stop-color="#2a0d4a"/>
    </linearGradient>
    <linearGradient id="mandGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="frGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#frBg)"/>
  <!-- Complex coordinate plane axes -->
  <line x1="80" y1="170" x2="560" y2="170" stroke="rgba(192,132,252,0.25)" stroke-width="1.2"/>
  <line x1="320" y1="40" x2="320" y2="300" stroke="rgba(192,132,252,0.25)" stroke-width="1.2"/>
  <!-- Stylized Mandelbrot cardioid and bulbs -->
  <g transform="translate(350, 170)" filter="url(#frGlow)">
    <!-- Main Cardioid -->
    <path d="M 30 0 C 30 -60, -90 -85, -110 0 C -90 85, 30 60, 30 0 Z" fill="#0d0418" stroke="url(#mandGlow)" stroke-width="2.5"/>
    <!-- Period-2 bulb left -->
    <circle cx="-140" cy="0" r="32" fill="#0d0418" stroke="url(#mandGlow)" stroke-width="2"/>
    <!-- Smaller bulbs -->
    <circle cx="-185" cy="0" r="13" fill="#0d0418" stroke="url(#mandGlow)" stroke-width="1.5"/>
    <circle cx="-204" cy="0" r="6" fill="#0d0418" stroke="url(#mandGlow)" stroke-width="1.2"/>
    <!-- Top & bottom bulbs -->
    <circle cx="-50" cy="-68" r="22" fill="#0d0418" stroke="url(#mandGlow)" stroke-width="1.8"/>
    <circle cx="-50" cy="68" r="22" fill="#0d0418" stroke="url(#mandGlow)" stroke-width="1.8"/>
    <!-- Satellite spirals -->
    <circle cx="0" cy="-60" r="12" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="0" cy="60" r="12" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="-100" cy="-55" r="14" fill="none" stroke="#e879f9" stroke-width="1.2"/>
    <circle cx="-100" cy="55" r="14" fill="none" stroke="#e879f9" stroke-width="1.2"/>
  </g>
  <!-- Formula label -->
  <text x="320" y="325" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#e879f9" text-anchor="middle">
    FRACTALENS · BIBLIOTHÈQUE JAVA · Z_{N+1} = Z_N^2 + C
  </text>
</svg>

