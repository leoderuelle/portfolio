<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="c8Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <filter id="c8Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#c8Bg)"/>
  <!-- Monochrome 64x32 Retro Pixel Display Grid -->
  <g transform="translate(140, 50)" filter="url(#c8Glow)">
    <rect x="0" y="0" width="360" height="190" rx="8" fill="#04070a" stroke="#00f0ff" stroke-width="2.5"/>
    <!-- CRT Grid lines -->
    <line x1="20" y1="95" x2="340" y2="95" stroke="#00f0ff" stroke-width="0.5" opacity="0.2"/>
    <!-- Space Invaders / Pong sprite in pixels -->
    <g fill="#00f0ff" transform="translate(130, 45) scale(8)">
      <rect x="2" y="0" width="1" height="1"/>
      <rect x="8" y="0" width="1" height="1"/>
      <rect x="3" y="1" width="1" height="1"/>
      <rect x="7" y="1" width="1" height="1"/>
      <rect x="2" y="2" width="7" height="1"/>
      <rect x="1" y="3" width="2" height="1"/>
      <rect x="4" y="3" width="3" height="1"/>
      <rect x="8" y="3" width="2" height="1"/>
      <rect x="0" y="4" width="11" height="1"/>
      <rect x="0" y="5" width="1" height="1"/>
      <rect x="2" y="5" width="7" height="1"/>
      <rect x="10" y="5" width="1" height="1"/>
      <rect x="0" y="6" width="1" height="1"/>
      <rect x="2" y="6" width="1" height="1"/>
      <rect x="8" y="6" width="1" height="1"/>
      <rect x="10" y="6" width="1" height="1"/>
      <rect x="3" y="7" width="2" height="1"/>
      <rect x="6" y="7" width="2" height="1"/>
    </g>
    <!-- Opcodes debug bar -->
    <text x="20" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#70b8ff" opacity="0.8">
      PC: 0x0200 | OPCODE: 0xDXYN | V0: 0x42 | I: 0x0350
    </text>
  </g>
  <text x="320" y="315" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#00f0ff" text-anchor="middle">
    ÉMULATEUR CHIP-8 · C++17 &amp; SDL2 · CPU CYCLE &amp; OPCODES
  </text>
</svg>

